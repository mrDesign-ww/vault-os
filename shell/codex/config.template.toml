# The vault's AGENTS.md (Codex mirror of CLAUDE.md) supplies the operating rules.
# On first open of the vault, Codex will prompt to trust the project, the plugin
# hooks, and ~/.codex/hooks.json; that is expected and machine-specific.

# --- Optional MCP servers ----------------------------------------------------
# Codex reads MCP servers from this file. None ships enabled: each one is the
# teammate's own account and network boundary. installer/install-codex-layer.py
# --mcp higgsfield adds a URL-only block from shell/claude/mcp-servers.json (the
# owner runs higgsfield here); sign in with a personal account on first use.

# --- Skills ------------------------------------------------------------------
# Codex does not read ~/.claude/skills. To give it the same toolkit, run
# installer/install-claude-layer.py with --extra-skills-dir ~/.codex/skills and
# --extra-skills-dir ~/.agents/skills (the second path is what the bundled
# impeccable design hook in hooks.template.json looks for). Skills that ship a Codex variant carry it in their own agents/
# folder; nothing else changes between the two copies.
