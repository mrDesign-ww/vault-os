# Vault OS — Codex shell template.
# The installer MERGES these blocks into the teammate's ~/.codex/config.toml
# AFTER backing up the existing file. It contains NO secrets, NO personal paths,
# NO machine-specific trust hashes — those are auth'd / regenerated on the teammate's
# machine (auth.json via OpenAI login; [hooks.state] via Codex's trust prompt).
#
# HOOKS DIFFER FROM CLAUDE. Codex does NOT keep hook definitions here. Unlike Claude
# (whose hooks live inside settings.json), Codex reads hooks from a SEPARATE file
# ~/.codex/hooks.json (see hooks.template.json in this folder) and records a per-hook
# trust hash under [hooks.state] the first time each fires. Never ship [hooks.state]:
# it is machine- and content-specific and regenerates via Codex's trust prompt when
# the teammate first opens the vault.

model = "gpt-5.5"                 # set to whichever model your Codex account offers
model_reasoning_effort = "high"
service_tier = "default"

# --- Marketplaces (public git sources; Codex clones and caches them) ---------
# The public claude-obsidian plugin gives Codex the same wiki skills, commands,
# agents, and hooks the Claude side uses — including the Codex-mirrored evolution
# skills ($evolution / $evolution-verifier).
[marketplaces.agricidaniel-claude-obsidian]
source_type = "git"
source = "https://github.com/AgriciDaniel/claude-obsidian.git"

# The official Claude plugins marketplace, mirrored into Codex for parity with the
# Claude toolset (review, feature-dev, figma, vercel, supabase, and more).
[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

# --- Plugins (mirror of the Claude side; enable/disable to taste) ------------
[plugins."claude-obsidian@agricidaniel-claude-obsidian"]
enabled = true

[plugins."agent-sdk-dev@claude-plugins-official"]
enabled = true

[plugins."chrome-devtools-mcp@claude-plugins-official"]
enabled = true

[plugins."claude-md-management@claude-plugins-official"]
enabled = true

[plugins."code-review@claude-plugins-official"]
enabled = true

[plugins."code-simplifier@claude-plugins-official"]
enabled = true

[plugins."commit-commands@claude-plugins-official"]
enabled = true

[plugins."context7@claude-plugins-official"]
enabled = true

[plugins."feature-dev@claude-plugins-official"]
enabled = true

[plugins."figma@claude-plugins-official"]
enabled = true

[plugins."frontend-design@claude-plugins-official"]
enabled = true

[plugins."github@claude-plugins-official"]
enabled = true

[plugins."playground@claude-plugins-official"]
enabled = true

[plugins."playwright@claude-plugins-official"]
enabled = true

[plugins."security-guidance@claude-plugins-official"]
enabled = true

[plugins."skill-creator@claude-plugins-official"]
enabled = true

[plugins."supabase@claude-plugins-official"]
enabled = true

[plugins."superpowers@claude-plugins-official"]
enabled = true

[plugins."typescript-lsp@claude-plugins-official"]
enabled = true

[plugins."vercel@claude-plugins-official"]
enabled = true

# The vault's AGENTS.md (Codex mirror of CLAUDE.md) supplies the operating rules.
# On first open of the vault, Codex will prompt to trust the project, the plugin
# hooks, and ~/.codex/hooks.json; that is expected and machine-specific.
